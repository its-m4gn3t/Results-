<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bordio Dashboard — Workflow Enhanced</title>
<style>
    /* --- Basic reset --- */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
        background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
        -webkit-font-smoothing:antialiased;
        color:#0f172a;
    }

    /* --- Header --- */
    .header{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;z-index:120;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
    .logo{font-weight:800;font-size:20px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .add-task-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:10px 16px;border-radius:22px;cursor:pointer;font-weight:700;box-shadow:0 6px 18px rgba(102,126,234,0.28)}

    /* --- Layout --- */
    .dashboard{height:100vh;padding-top:88px;padding-left:20px;padding-right:20px;overflow:hidden}
    .board{display:flex;gap:18px;align-items:flex-start;height:calc(100vh - 88px - 92px);overflow-x:auto;overflow-y:hidden;padding-bottom:20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
    .column{background:rgba(255,255,255,0.96);border-radius:14px;padding:18px;min-width:320px;max-height:100%;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.04)}
    .column-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,0.04)}
    .column-title{font-weight:800;font-size:16px;color:#111827}
    .column-count{background:#eef2ff;color:#4f46e5;padding:6px 10px;border-radius:14px;font-weight:800;font-size:13px}

    /* --- Tasks --- */
    .task-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);cursor:grab;border-left:4px solid #667eea;position:relative;transition:transform .16s ease,box-shadow .16s ease}
    .task-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,0.12)}
    .task-card.dragging{opacity:.5;transform:rotate(3deg)}
    .task-card.completed{opacity:.6;background:#f9fafb;border-left-color:#6b7280}
    .task-title{font-weight:700;margin-bottom:6px;font-size:15px;color:#0f172a}
    .task-desc{font-size:14px;color:#6b7280;margin-bottom:10px;line-height:1.35}
    .task-footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9ca3af}
    .priority{padding:4px 8px;border-radius:8px;font-weight:800;font-size:12px}
    .priority.high{background:#fee2e2;color:#b91c1c}
    .priority.medium{background:#fef3c7;color:#92400e}
    .priority.low{background:#d1fae5;color:#065f46}
    .task-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:#9aa0ad}

    .add-card-btn{display:block;width:100%;text-align:center;padding:12px;margin-top:6px;border-radius:10px;border:2px dashed rgba(99,102,241,0.12);background:#fbfdff;color:#475569;font-weight:700;cursor:pointer}

    /* --- Mobile tab bar --- */
    .mobile-tabbar{position:fixed;left:12px;right:12px;bottom:12px;height:64px;z-index:140;display:none;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.98);border-radius:14px;padding:6px 10px;box-shadow:0 18px 40px rgba(0,0,0,0.14);border:1px solid rgba(0,0,0,0.06);backdrop-filter:blur(6px)}
    .tab-button{flex:1 1 0;height:100%;display:flex;align-items:center;gap:8px;justify-content:center;cursor:pointer;color:#6b7280;font-size:12px;border-radius:10px;user-select:none;padding:6px 6px;transition:all .14s ease}
    .tab-button svg{width:20px;height:20px;display:block}
    .tab-button .label{display:block;font-size:12px;line-height:1;margin-top:2px}
    .tab-button.active{background:linear-gradient(135deg,#eef2ff,#f5f3ff);color:#4f46e5;transform:translateY(-2px);box-shadow:0 8px 22px rgba(79,70,229,0.12)}
    .tab-badge{position:absolute;top:6px;right:10px;background:#ef4444;color:white;padding:4px 6px;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;text-align:center}

    /* --- Bottom sheet (task actions) --- */
    .sheet-backdrop{position:fixed;left:0;right:0;top:0;bottom:0;z-index:160;display:none;background:rgba(2,6,23,0.5);align-items:flex-end}
    .sheet{background:#fff;border-top-left-radius:14px;border-top-right-radius:14px;padding:14px;max-height:60vh;overflow:auto;box-shadow:0 -8px 40px rgba(2,6,23,0.18)}
    .sheet .sheet-handle{width:44px;height:6px;background:#e6e9ef;border-radius:6px;margin:6px auto}
    .sheet h3{font-size:16px;margin:8px 0 10px}
    .sheet p{color:#475569;font-size:14px;margin-bottom:12px}
    .sheet .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .btn.ghost{background:#f8fafc;color:#334155;border:1px solid #e2e8f0}
    .btn.danger{background:#fee2e2;color:#991b1b}

    /* --- Modal for create/edit --- */
    .modal-backdrop{position:fixed;left:0;right:0;top:0;bottom:0;z-index:170;display:none;background:rgba(2,6,23,0.5);align-items:center;justify-content:center}
    .modal{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(2,6,23,0.16)}
    .form-row{margin-bottom:10px}
    label{display:block;font-size:13px;margin-bottom:6px;font-weight:700}
    input[type="text"],textarea,select,input[type="date"]{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;background:#fbfdff}
    textarea{min-height:90px;resize:vertical}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}

    /* media */
    @media (max-width:768px){
        .dashboard{padding-left:12px;padding-right:12px;padding-top:84px}
        .board{gap:12px;height:calc(100vh - 84px - 96px);padding-bottom:90px}
        .column{min-width:calc(100vw - 32px);max-width:calc(100vw - 32px);height:100%}
        .mobile-tabbar{display:flex}
    }

    /* keyboard focus */
    .tab-button:focus,.add-task-btn:focus,.btn:focus,input:focus,textarea:focus{outline:3px solid rgba(99,102,241,0.12);outline-offset:2px}
    .sr-only{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
    <div class="header" role="banner">
        <div class="logo">Bordio Dashboard</div>
        <div style="display:flex;gap:10px;align-items:center">
            <button class="add-task-btn" id="global-add">+ New Task</button>
        </div>
    </div>

    <main class="dashboard" role="main">
        <div class="board" id="board" aria-label="task board"></div>
    </main>

    <!-- Mobile Tab Bar -->
    <nav class="mobile-tabbar" role="navigation" aria-label="Board tabs">
        <div class="tab-button tab-col" data-target="todo" id="tab-todo" tabindex="0" aria-pressed="false" title="To Do" style="position:relative">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 2h6a2 2 0 0 1 2 2v0a0 0 0 0 1 0 0h-10a2 2 0 0 0-2 2v0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="7" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M8 11h8M8 15h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="label">To Do</span>
            <span class="tab-badge" id="badge-todo" style="display:none">0</span>
        </div>

        <div class="tab-button tab-col" data-target="in-progress" id="tab-inprogress" tabindex="0" aria-pressed="false" title="In Progress" style="position:relative">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3.2-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 3v6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="label">Progress</span>
            <span class="tab-badge" id="badge-inprogress" style="display:none">0</span>
        </div>

        <div class="tab-button tab-col" data-target="review" id="tab-review" tabindex="0" aria-pressed="false" title="Review" style="position:relative">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.4"/></svg>
            <span class="label">Review</span>
            <span class="tab-badge" id="badge-review" style="display:none">0</span>
        </div>

        <div class="tab-button tab-col" data-target="done" id="tab-done" tabindex="0" aria-pressed="false" title="Done" style="position:relative">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="label">Done</span>
            <span class="tab-badge" id="badge-done" style="display:none">0</span>
        </div>
    </nav>

    <!-- Bottom sheet (task actions) -->
    <div class="sheet-backdrop" id="sheet-backdrop" aria-hidden="true">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-handle" aria-hidden="true"></div>
            <h3 id="sheet-title">Task actions</h3>
            <p id="sheet-desc">Choose an action for the selected task.</p>

            <div style="display:flex;gap:8px;margin-bottom:10px">
                <button class="btn primary" id="sheet-edit">Edit</button>
                <button class="btn ghost" id="sheet-view">View</button>
                <button class="btn danger" id="sheet-delete">Delete</button>
            </div>

            <div style="margin-bottom:10px">
                <strong style="display:block;margin-bottom:8px">Move to</strong>
                <div class="sheet-actions" id="sheet-move-actions">
                    <button class="btn ghost" data-move="todo">To Do</button>
                    <button class="btn ghost" data-move="in-progress">In Progress</button>
                    <button class="btn ghost" data-move="review">Review</button>
                    <button class="btn ghost" data-move="done">Done</button>
                </div>
            </div>

            <div style="display:flex;gap:8px;align-items:center">
                <button class="btn primary" id="sheet-mark-done">Mark Done</button>
                <button class="btn ghost" id="sheet-close">Close</button>
            </div>
        </div>
    </div>

    <!-- Modal for create/edit -->
    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h3 id="modal-title">Create Task</h3>
            <div class="form-row">
                <label for="task-title">Title</label>
                <input id="task-title" type="text" />
            </div>
            <div class="form-row">
                <label for="task-desc">Description</label>
                <textarea id="task-desc"></textarea>
            </div>
            <div class="form-row" style="display:flex;gap:8px">
                <div style="flex:1">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div style="width:140px">
                    <label for="task-due">Due</label>
                    <input id="task-due" type="date" />
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn ghost" id="modal-cancel">Cancel</button>
                <button class="btn primary" id="modal-save">Save</button>
            </div>
        </div>
    </div>

<script>
/* ------------- DATA & STORAGE ------------- */
const STORAGE_KEY = 'bordio_tasks_v1';

const defaultTasks = [
    {id:genId(), title:'Design Leo Club landing page', desc:'Responsive hero + stats + CTAs.', priority:'high', status:'todo', due:'2025-12-05', completed:false},
    {id:genId(), title:'Setup FastAPI backend', desc:'Initial endpoints for auth & club mgmt.', priority:'medium', status:'todo', due:'2025-11-28', completed:true},
    {id:genId(), title:'PUBG Mobile tournament scheduler', desc:'Drag-and-drop match scheduling.', priority:'high', status:'in-progress', due:'2025-12-03', completed:false},
    {id:genId(), title:'Ngrok tunnel for local demo', desc:'Public URL for demo.', priority:'low', status:'review', due:'2025-12-02', completed:false},
    {id:genId(), title:'Responsive MERN deployment', desc:'Deployed to Render services.', priority:'high', status:'done', due:'2025-11-25', completed:true}
];

let tasks = loadTasks();

/* ------------- INITIAL RENDER ------------- */
const board = document.getElementById('board');
const statuses = ['todo','in-progress','review','done'];
const statusLabels = {'todo':'To Do','in-progress':'In Progress','review':'Review','done':'Done'};

function loadTasks(){
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) return JSON.parse(raw);
    } catch (e) { console.warn('load error', e); }
    return defaultTasks;
}
function saveTasks(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e){ console.warn('save error', e); }
}

/* ------------- UI BUILD ------------- */
function buildBoard(){
    board.innerHTML = '';
    statuses.forEach(status => {
        const section = document.createElement('section');
        section.className = 'column';
        section.dataset.status = status;
        section.id = `col-${status}`;
        section.setAttribute('aria-label', statusLabels[status]);

        section.innerHTML = `
            <div class="column-header">
                <div class="column-title">${statusLabels[status]}</div>
                <div class="column-count" id="count-${status}">0</div>
            </div>
        `;

        // append tasks for this status
        const list = tasks.filter(t => t.status === status);
        list.forEach(t => section.appendChild(makeTaskElement(t)));
        // add button
        const addBtn = document.createElement('div');
        addBtn.className = 'add-card-btn';
        addBtn.textContent = '+ Add Task';
        addBtn.onclick = () => openModalForCreate(status);
        section.appendChild(addBtn);

        // dragover/drop
        section.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
        section.addEventListener('drop', e => {
            e.preventDefault();
            if(currentDrag) {
                // move the task to this status and re-render
                const id = currentDrag.dataset.id;
                updateTaskStatus(id, status);
                currentDrag.classList.remove('dragging');
                currentDrag = null;
            }
        });

        board.appendChild(section);
    });

    updateCounts();
    updateTabBadges();
}

function makeTaskElement(task){
    const card = document.createElement('article');
    card.className = 'task-card' + (task.completed ? ' completed' : '');
    card.draggable = true;
    card.dataset.id = task.id;
    card.innerHTML = `
        <div class="task-title">${escapeHtml(task.title)}</div>
        <div class="task-desc">${escapeHtml(task.desc)}</div>
        <div class="task-footer">
            <div class="task-meta"><span class="priority ${task.priority}">${capitalize(task.priority)}</span></div>
            <div class="task-meta">${task.due ? 'Due: ' + escapeHtml(task.due) : ''}</div>
        </div>
    `;
    attachTaskHandlers(card);
    return card;
}

/* ------------- DRAG & DROP ------------- */
let currentDrag = null;
function attachTaskHandlers(card){
    card.addEventListener('dragstart', (e) => {
        currentDrag = card;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        currentDrag = null;
        saveTasks();
        buildBoard();
    });

    // click opens sheet (mobile-friendly)
    card.addEventListener('click', (e) => {
        openSheetForTask(card.dataset.id);
    });

    // double click opens edit modal on desktop
    card.addEventListener('dblclick', () => {
        openModalForEdit(card.dataset.id);
    });
}

/* ------------- ACTIONS (move/edit/delete/mark done) ------------- */
function updateTaskStatus(id, newStatus){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.status = newStatus;
    t.completed = (newStatus === 'done') ? true : t.completed;
    saveTasks();
    buildBoard();
}

function markTaskDone(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.completed = true;
    t.status = 'done';
    saveTasks();
    buildBoard();
}

function deleteTask(id){
    tasks = tasks.filter(x=>x.id!==id);
    saveTasks();
    buildBoard();
}

function editTaskPayload(id, payload){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    Object.assign(t, payload);
    saveTasks();
    buildBoard();
}

/* ------------- SHEET (bottom actions) ------------- */
const sheetBackdrop = document.getElementById('sheet-backdrop');
const sheetDesc = document.getElementById('sheet-desc');
let sheetTargetId = null;

function openSheetForTask(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    sheetTargetId = id;
    sheetBackdrop.style.display = 'flex';
    sheetBackdrop.setAttribute('aria-hidden','false');
    document.getElementById('sheet-title').textContent = t.title;
    document.getElementById('sheet-desc').textContent = t.desc || '(no description)';
}
function closeSheet(){
    sheetBackdrop.style.display = 'none';
    sheetBackdrop.setAttribute('aria-hidden','true');
    sheetTargetId = null;
}

/* sheet buttons */
document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('sheet-view').addEventListener('click', () => {
    if(!sheetTargetId) return;
    const t = tasks.find(x=>x.id===sheetTargetId);
    if(!t) return;
    openModalForView(t);
});
document.getElementById('sheet-edit').addEventListener('click', () => {
    if(!sheetTargetId) return;
    openModalForEdit(sheetTargetId);
});
document.getElementById('sheet-delete').addEventListener('click', () => {
    if(!sheetTargetId) return;
    if(confirm('Delete this task?')) {
        deleteTask(sheetTargetId);
        closeSheet();
    }
});
document.getElementById('sheet-mark-done').addEventListener('click', () => {
    if(!sheetTargetId) return;
    markTaskDone(sheetTargetId);
    closeSheet();
});

document.getElementById('sheet-move-actions').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn || !sheetTargetId) return;
    const target = btn.dataset.move;
    if(target && statuses.includes(target)) {
        updateTaskStatus(sheetTargetId, target);
        closeSheet();
    }
});

sheetBackdrop.addEventListener('click', (e) => {
    if(e.target === sheetBackdrop) closeSheet();
});

/* ------------- MODAL (create/edit/view) ------------- */
const modalBackdrop = document.getElementById('modal-backdrop');
const modalTitle = document.getElementById('modal-title');
const inputTitle = document.getElementById('task-title');
const inputDesc = document.getElementById('task-desc');
const inputPriority = document.getElementById('task-priority');
const inputDue = document.getElementById('task-due');
let modalMode = 'create'; // create | edit | view
let modalTargetId = null;

document.getElementById('global-add').addEventListener('click', () => openModalForCreate('todo'));
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-save').addEventListener('click', () => {
    const title = inputTitle.value.trim();
    if(!title){ alert('Please provide a title'); inputTitle.focus(); return; }
    const payload = { title, desc: inputDesc.value.trim(), priority: inputPriority.value, due: inputDue.value || '' };
    if(modalMode === 'create'){
        const newTask = { id: genId(), completed:false, status: modalTargetId || 'todo', ...payload };
        tasks.unshift(newTask); // put new tasks to top
    } else if(modalMode === 'edit'){
        editTaskPayload(modalTargetId, payload);
    }
    saveTasks();
    closeModal();
    buildBoard();
});

function openModalForCreate(status='todo'){
    modalMode = 'create'; modalTargetId = status;
    modalTitle.textContent = 'Create Task';
    inputTitle.value = ''; inputDesc.value = ''; inputPriority.value = 'medium'; inputDue.value = '';
    showModal();
}

function openModalForEdit(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    modalMode = 'edit'; modalTargetId = id;
    modalTitle.textContent = 'Edit Task';
    inputTitle.value = t.title; inputDesc.value = t.desc; inputPriority.value = t.priority || 'medium'; inputDue.value = t.due || '';
    showModal();
}

function openModalForView(task){
    modalMode = 'view'; modalTargetId = null;
    modalTitle.textContent = 'View Task';
    inputTitle.value = task.title; inputDesc.value = task.desc; inputPriority.value = task.priority || 'medium'; inputDue.value = task.due || '';
    // disable inputs for view
    inputTitle.disabled = inputDesc.disabled = inputPriority.disabled = inputDue.disabled = true;
    document.getElementById('modal-save').style.display = 'none';
    showModal();
}

function showModal(){
    // make sure inputs enabled for create/edit
    if(modalMode !== 'view'){
        inputTitle.disabled = inputDesc.disabled = inputPriority.disabled = inputDue.disabled = false;
        document.getElementById('modal-save').style.display = 'inline-block';
    }
    modalBackdrop.style.display = 'flex';
    modalBackdrop.setAttribute('aria-hidden','false');
    inputTitle.focus();
}

function closeModal(){
    modalBackdrop.style.display = 'none';
    modalBackdrop.setAttribute('aria-hidden','true');
    modalMode = 'create'; modalTargetId = null;
    inputTitle.disabled = inputDesc.disabled = inputPriority.disabled = inputDue.disabled = false;
}

/* ------------- HELPERS & UTILS ------------- */
function updateCounts(){
    statuses.forEach(s => {
        const count = tasks.filter(t => t.status === s).length;
        const el = document.getElementById(`count-${s}`);
        if(el) el.textContent = count;
    });
    updateTabBadges();
}

function updateTabBadges(){
    statuses.forEach(s=>{
        const badge = document.getElementById(`badge-${s.replace('in-progress','inprogress')}`) || document.getElementById(`badge-${s}`);
        const countEl = document.getElementById(`count-${s}`);
        const count = countEl ? parseInt(countEl.textContent,10) : 0;
        const badgeEl = document.getElementById(`badge-${s}`);
        if(badgeEl){
            if(count>0){ badgeEl.style.display='inline-block'; badgeEl.textContent = count; }
            else badgeEl.style.display='none';
        }
    });
}

/* tab navigation (scroll to column) */
const tabButtons = document.querySelectorAll('.tab-button');
tabButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const target = btn.dataset.target;
        const col = document.getElementById(`col-${target}`);
        if(col){
            const leftPos = col.offsetLeft - board.offsetLeft;
            board.scrollTo({left:leftPos - 12, behavior:'smooth'});
            setActiveTab(btn.id);
        }
    });
    btn.addEventListener('keydown',(e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); btn.click(); }});
});

function setActiveTab(tabId){
    tabButtons.forEach(t => {
        if(t.id===tabId) { t.classList.add('active'); t.setAttribute('aria-pressed','true'); }
        else { t.classList.remove('active'); t.setAttribute('aria-pressed','false'); }
    });
}

/* IntersectionObserver to sync active tab while scrolling */
function observeActiveColumn(){
    if(!('IntersectionObserver' in window)) return;
    const obs = new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting){
                const id = entry.target.id.replace('col-','');
                const tabId = id === 'in-progress' ? 'tab-inprogress' : `tab-${id}`;
                setActiveTab(tabId);
            }
        });
    }, {root: board, threshold: 0.6});
    statuses.forEach(s => {
        const el = document.getElementById(`col-${s}`);
        if(el) obs.observe(el);
    });
}

/* simple helpers */
function genId(){ return 't_' + Math.random().toString(36).slice(2,9); }
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ------------- EVENTS: keyboard, load, resize ------------- */
window.addEventListener('load', ()=>{
    buildBoard();
    observeActiveColumn();
    // default active tab
    setActiveTab('tab-todo');
    // center default column on mobile
    if(window.matchMedia('(max-width:768px)').matches){
        const col = document.getElementById('col-todo');
        if(col) board.scrollTo({left: col.offsetLeft - board.offsetLeft, behavior:'smooth'});
    }
});

window.addEventListener('resize', ()=>{
    // small adjustment when resizing
});
